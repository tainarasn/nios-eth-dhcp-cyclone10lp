<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliente Nios II Ethernet</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --mut:#677085; --acc:#0a66c2; --ok:#1a7f37; --err:#c62828; --bd:#dde1e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d2128; --fg:#e6e9ef; --mut:#9aa3b5; --acc:#5aa9ff; --ok:#56d364; --err:#ff7b72; --bd:#323844; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, Segoe UI, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--mut); margin: 0 0 20px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=text] { width:100%; padding:9px 10px; font:inherit; color:var(--fg); background:var(--bg);
                     border:1px solid var(--bd); border-radius:7px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  .row > div { flex:1 1 220px; }
  button { padding:9px 18px; font:inherit; font-weight:600; border:0; border-radius:7px; background:var(--acc); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--mut); font-size:13px; margin-top:4px; }
  .status { font-size:13px; margin-top:10px; min-height:1.2em; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .out { font: 18px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; padding:10px; background:var(--bg); border-radius:7px; min-height:44px; }
  .tablewrap { overflow-x:auto; margin-top:12px; }
  table { border-collapse: collapse; font: 13px ui-monospace, Consolas, monospace; }
  td, th { border:1px solid var(--bd); padding:3px 6px; text-align:center; }
  th { color:var(--mut); font-weight:600; }
  .chg { color: var(--err); font-weight:700; }
  ul#hist { margin:0; padding-left:18px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Cliente Nios II &mdash; Ethernet + USER HW</h1>
  <p class="sub">Página local do PC. Envia uma string (até 100 caracteres) ao web server do Nios II na Cyclone 10 LP;
     o USER HW soma 1 a cada caractere (0xF7 &rarr; 0x00) e a placa devolve o resultado.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="ip">IP da placa (obtido por DHCP, veja o nios2-terminal)</label>
        <input type="text" id="ip" placeholder="ex.: 192.168.0.57">
      </div>
      <div style="flex:0 0 auto"><button id="ping" type="button">Testar conexão</button></div>
    </div>
  </div>

  <div class="card">
    <label for="s">String a transmitir</label>
    <input type="text" id="s" maxlength="100" placeholder="Digite até 100 caracteres" autocomplete="off">
    <div class="hint"><span id="cnt">0</span>/100 caracteres &middot; caracteres fora de Latin-1 viram "?"</div>
    <p><button id="send" type="button">Enviar para a placa</button></p>
    <div id="st" class="status"></div>
  </div>

  <div class="card">
    <label>String recebida da placa</label>
    <div class="out" id="out"></div>
    <div class="tablewrap"><table id="tbl"></table></div>
  </div>

  <div class="card">
    <label>Histórico</label>
    <ul id="hist"></ul>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
try { $('ip').value = localStorage.getItem('nios_ip') || ''; } catch (e) {}

$('s').addEventListener('input', () => { $('cnt').textContent = $('s').value.length; });
$('s').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('send').addEventListener('click', send);
$('ping').addEventListener('click', async () => {
  const base = baseUrl(); if (!base) return;
  status('Conectando a ' + base + ' ...');
  try {
    const r = await fetch(base + '/api?h=', { cache: 'no-store' });
    const j = await r.json();
    status('Placa respondeu (IP ' + j.ip + ', ' + j.count + ' strings processadas pelo USER HW).', 'ok');
  } catch (e) { status('Sem resposta: ' + e, 'err'); }
});

function baseUrl() {
  const ip = $('ip').value.trim();
  if (!ip) { status('Informe o IP da placa.', 'err'); return null; }
  try { localStorage.setItem('nios_ip', ip); } catch (e) {}
  return 'http://' + ip;
}
function status(msg, cls) { const s = $('st'); s.textContent = msg; s.className = 'status ' + (cls || ''); }
function hex2(c) { return (c < 16 ? '0' : '') + c.toString(16); }
function show(c) { return c === 0 ? '␀' : (c < 32 || c === 127) ? '·' : String.fromCharCode(c); }

async function send() {
  const base = baseUrl(); if (!base) return;
  const s = $('s').value.slice(0, 100);
  const bytes = [];
  for (const ch of s) { const c = ch.codePointAt(0); bytes.push(c > 255 ? 63 : c); }
  if (bytes.length > 100) bytes.length = 100;
  const h = bytes.map(hex2).join('');
  $('send').disabled = true;
  status('Enviando ' + bytes.length + ' bytes ...');
  const t0 = performance.now();
  try {
    const r = await fetch(base + '/api?h=' + h, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const ms = (performance.now() - t0).toFixed(0);
    const out = [];
    for (let i = 0; i < j.out.length; i += 2) out.push(parseInt(j.out.substr(i, 2), 16));
    $('out').textContent = out.map(show).join('');
    render(bytes, out);
    status('Resposta em ' + ms + ' ms. Total de strings processadas pelo USER HW: ' + j.count + '.', 'ok');
    const li = document.createElement('li');
    li.textContent = new Date().toLocaleTimeString() + '  "' + s + '"  →  "' + out.map(show).join('') + '"';
    $('hist').prepend(li);
  } catch (e) {
    status('Erro: ' + e + '  (confira o IP, o cabo e se o PC está na mesma rede DHCP)', 'err');
  } finally { $('send').disabled = false; }
}

function render(inp, out) {
  const t = $('tbl'); t.innerHTML = '';
  if (!inp.length) return;
  const rows = [['#'], ['in'], ['hex in'], ['hex out'], ['out']];
  inp.forEach((c, i) => {
    rows[0].push(i); rows[1].push(show(c)); rows[2].push(hex2(c));
    rows[3].push(hex2(out[i])); rows[4].push(show(out[i]));
  });
  rows.forEach((r, k) => {
    const tr = document.createElement('tr');
    r.forEach((v, i) => {
      const td = document.createElement(i === 0 ? 'th' : 'td');
      td.textContent = v;
      if (k >= 3 && i > 0 && inp[i - 1] === 0xF7) td.className = 'chg';
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
}
</script>
</body>
</html>
